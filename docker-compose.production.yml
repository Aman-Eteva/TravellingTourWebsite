name: roamly
services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set your production domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY_HOPS: 1
      CLIENT_URL: https://${SITE_DOMAIN:?Set your production domain}
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL connection URL using host db}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT signing secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a distinct random refresh signing secret}
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      SMTP_HOST: ${SMTP_HOST:?Set your SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set your sender email}
    depends_on:
      db: { condition: service_healthy }
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the production database password}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 5s
      timeout: 5s
      retries: 20
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: ["ollama:/root/.ollama"]
  models:
    image: ollama/ollama:latest
    depends_on: [ollama]
    restart: on-failure
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      EMBED_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: /bin/sh
    command:
      [
        "-c",
        "until ollama list; do sleep 2; done; ollama pull $${CHAT_MODEL} && ollama pull $${EMBED_MODEL}",
      ]
volumes:
  postgres:
  ollama:
  caddy_data:
  caddy_config:
